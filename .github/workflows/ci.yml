name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    phpstan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
            - run: composer install --no-interaction --no-progress --no-ansi
            - run: composer phpstan
